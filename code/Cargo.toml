[package]
name = "code"
version = "0.1.0"
edition = "2024"
authors = ["220017916"]

[workspace]
resolver = "3"
members = ["beacon", "filetree-browser", "parser", "simple-tcp"]

[workspace.dependencies]
anyhow = "1.0.100"
beacon = { path = "beacon" }
chrono = "0.4"
config = "0.14"
env_logger = "0.11.8"
filetree-browser = { path = "filetree-browser" }
hostname = "0.4"
indicatif = "0.18.3"
libc = "*"
local-ip-address = "0.6"
log = "0.4.28"
nix = { version = "0.29", features = ["user"] }
parser = { path = "parser" }
serde = { version = "1.0", features = ["derive"] }
simple-tcp = { path = "simple-tcp" }
socket2 = "0.5"
tokio = { version = "=1.47.0", features = ["full"] }
tokio-stream = "0.1.17"

[dependencies]
anyhow.workspace = true
beacon.workspace = true
env_logger.workspace = true
filetree-browser.workspace = true
log.workspace = true
parser.workspace = true
tokio.workspace = true
