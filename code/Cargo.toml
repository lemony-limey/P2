[package]
name = "code"
version = "0.1.0"
edition = "2024"
authors = ["220017916"]
default-run = "code"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
chrono = "0.4"
config = "0.14"
env_logger = "0.11.8"
hostname = "0.4"
indicatif = "0.18.3"
indicatif-log-bridge = "0.2.3"
libc = "*"
local-ip-address = "0.6"
log = "0.4.28"
nix = { version = "0.29", features = ["user"] }
nom = "8.0.0"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
socket2 = "0.5"
tokio = { version = "=1.47.0", features = ["full"] }
