[package]
name = "simple-tcp"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.11"
local-ip-address = "0.6"
nix = { version = "0.29", features = ["user"] }
libc = "*"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
